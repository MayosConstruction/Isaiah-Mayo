<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf3e2">
  <title>Mayo's Construction</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Mayo's">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;600&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form" class="card login-card">
      <img class="logo" src="/logo.png" alt="Mayo's Construction logo">
      <h1>Mayo's Construction</h1>
      <p class="eyebrow">Hot Springs, AR</p>
      <label>Who are you?
        <select name="username">
          <option value="isaiah">Isaiah</option>
          <option value="moss">Moss</option>
        </select>
      </label>
      <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
      <p id="login-error" class="error"></p>
      <button class="btn primary" type="submit">Log in</button>
      <p class="muted" id="login-version" style="font-size:.8rem;margin:.8rem 0 0"></p>
    </form>
  </div>

  <div id="app" class="hidden">
    <header class="topbar no-print">
      <div class="brand">
        <img src="/logo.png" alt="">
        <span>Mayo's Construction</span>
      </div>
      <nav id="nav">
        <a href="#/">Home</a>
        <a href="#/jobs">Jobs</a>
        <a href="#/todos">To-Do</a>
        <a href="#/schedule">Schedule</a>
        <a href="#/customers">Customers</a>
        <a href="#/estimates">Estimates</a>
        <a href="#/money">Money</a>
        <a href="#/partners">Partners</a>
        <a href="#/contracts">Contracts</a>
        <a href="#/settings">Settings</a>
      </nav>
    </header>
    <main id="view"></main>
  </div>

  <dialog id="modal"><div id="modal-body"></div></dialog>
  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
