<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&display=swap">
<style>
  /* Single-sided 3.5" x 2" card + 0.125" bleed on every side = 3.75" x 2.25" */
  @page { size: 3.75in 2.25in; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Barlow, sans-serif; color: #151515; }
  .card { width: 3.75in; height: 2.25in; position: relative; overflow: hidden; background: #faf3e2; }
  .display { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; text-transform: uppercase; line-height: .95; }

  .logo { position: absolute; left: .3in; top: .3in; width: 1.08in; height: 1.08in; }
  .text { position: absolute; left: 1.5in; top: .4in; right: .28in; }
  .name { font-size: 16.5pt; white-space: nowrap; }
  .lines { font-family: 'Barlow Condensed'; font-weight: 700; color: #a42f28; letter-spacing: .03em; font-size: 6.6pt; text-transform: uppercase; margin-top: .05in; white-space: nowrap; }
  .owners { font-family: 'Barlow Condensed'; font-weight: 800; font-size: 12pt; text-transform: uppercase; margin-top: .14in; letter-spacing: .02em; }
  .owners span { color: #a42f28; font-weight: 700; font-size: 7.5pt; letter-spacing: .12em; margin-left: .05in; }
  .where { font-size: 7pt; font-weight: 600; color: #6e665a; margin-top: .03in; }

  .band { position: absolute; left: 0; right: 0; bottom: 0; height: .74in; background: #a42f28; border-top: .04in solid #151515;
    display: flex; align-items: center; padding: 0 .3in .1in .3in; color: #fff; }
  .band .call { flex: 1; }
  .band .phone { font-family: 'Barlow Condensed'; font-weight: 800; font-size: 20pt; line-height: 1; letter-spacing: .01em; }
  .band .sub { font-size: 7pt; font-weight: 600; margin-top: .02in; }
  .band .qr { width: .5in; height: .5in; background: #fff; padding: .025in; display: block; }
</style></head>
<body>
  <div class="card">
    <img class="logo" src="../public/logo.png" alt="">
    <div class="text">
      <div class="display name">Mayo's Construction</div>
      <div class="lines">Construction · Remodeling · Roofing</div>
      <div class="owners">Isaiah / Moss<span>Co-Owners</span></div>
      <div class="where">Hot Springs, Arkansas</div>
    </div>
    <div class="band">
      <div class="call">
        <div class="phone">870-617-3507</div>
        <div class="sub">Call or text for a free estimate</div>
      </div>
      <img class="qr" src="qr.svg" alt="">
    </div>
  </div>
</body></html>
