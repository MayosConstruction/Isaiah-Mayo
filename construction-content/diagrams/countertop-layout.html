<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #fafafa; font-family: Inter, sans-serif; color: #151515; }
  .head { width: 1230px; padding: 36px 0 0; }
  h1 { font-size: 34px; margin: 0 60px 6px; }
  p { font-size: 19px; margin: 0 60px; color: #555; }
  .draft { display: inline-block; margin: 14px 60px 0; background: #fff4d6; border: 2px solid #e0b33a; border-radius: 8px; padding: 8px 14px; font: 600 18px Inter, sans-serif; color: #6b4e00; }
  .piece { fill: #f5e3da; }
  .stripe { stroke: #d9875a; stroke-width: 4; }
  .outline { fill: none; stroke: #151515; stroke-width: 3; stroke-linejoin: round; }
  .seam { stroke: #a42f28; stroke-width: 6; stroke-linecap: round; }
  .tag rect { fill: #a42f28; }
  .tag text { fill: #fff; font: 700 20px Inter, sans-serif; text-anchor: middle; dominant-baseline: central; }
  .open { fill: #fff; stroke: #151515; stroke-width: 2.5; stroke-dasharray: 10 7; }
  .stove { fill: #fff; stroke: #151515; stroke-width: 3; }
  .burner { fill: none; stroke: #151515; stroke-width: 3; }
  .sink { fill: #fff; stroke: #151515; stroke-width: 3; }
  .under { fill: none; stroke: #555; stroke-width: 2.5; stroke-dasharray: 8 6; }
  .fridge { fill: #e4e4e4; stroke: #151515; stroke-width: 2.5; }
  .lbl { font: 700 20px Inter, sans-serif; fill: #151515; text-anchor: middle; dominant-baseline: central; }
  .sm { font: 500 17px Inter, sans-serif; fill: #555; text-anchor: middle; dominant-baseline: central; }
  .wall { fill: none; stroke: #151515; stroke-width: 10; stroke-linejoin: miter; }
</style></head>
<body>
<div class="head">
  <h1>Countertop layout: seam at every turn</h1>
  <p>Drawn from the site photos. The stripes follow each run and change direction at every seam.</p>
  <div class="draft">Not to scale. Lengths are estimates. Measure before cutting.</div>
</div>
<svg width="1230" height="1052" viewBox="0 120 1230 1052">
<defs>
  <pattern id="h" width="40" height="28" patternUnits="userSpaceOnUse"><line x1="0" y1="8" x2="40" y2="8" class="stripe"/></pattern>
  <pattern id="v" width="28" height="40" patternUnits="userSpaceOnUse"><line x1="8" y1="0" x2="8" y2="40" class="stripe"/></pattern>
  <pattern id="d" width="40" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="8" x2="40" y2="8" class="stripe"/></pattern>
</defs>
<polyline class="wall" points="120.0,1155.5 114.8,194.8 718.0,194.8 1035.2,512.0 1035.2,1032.0"/>
<text class="sm" x="458.0" y="167.5" >window</text>
<text class="sm" x="913.0" y="317.0" transform="rotate(45 913.0 317.0)">corner window</text>
<text class="sm" x="87.5" y="525.0" transform="rotate(-90 87.5 525.0)">stove wall</text>
<text class="sm" x="1062.5" y="687.5" transform="rotate(90 1062.5 687.5)">fridge wall</text>

<polygon class="piece" points="120.0,200.0 718.0,200.0 650.7,362.5 341.0,362.5 311.8,391.8"/><polygon fill="url(#h)" points="120.0,200.0 718.0,200.0 650.7,362.5 341.0,362.5 311.8,391.8"/>
<polygon class="piece" points="718.0,200.0 1030.0,512.0 867.5,579.3 650.7,362.5"/><polygon fill="url(#d)" points="718.0,200.0 1030.0,512.0 867.5,579.3 650.7,362.5"/>
<polygon class="piece" points="1030.0,512.0 1030.0,798.0 867.5,798.0 867.5,579.3"/><polygon fill="url(#v)" points="1030.0,512.0 1030.0,798.0 867.5,798.0 867.5,579.3"/>
<polygon class="piece" points="120.0,200.0 311.8,391.8 282.5,421.0 282.5,603.0 120.0,603.0"/><polygon fill="url(#v)" points="120.0,200.0 311.8,391.8 282.5,421.0 282.5,603.0 120.0,603.0"/>
<polygon class="piece" points="120.0,895.5 282.5,895.5 282.5,1129.5 120.0,1129.5"/><polygon fill="url(#v)" points="120.0,895.5 282.5,895.5 282.5,1129.5 120.0,1129.5"/>

<g transform="translate(816.5,413.5) rotate(45)">
  <rect class="sink" x="-104.0" y="-58.5" width="100.8" height="117.0" rx="10"/>
  <rect class="sink" x="3.2" y="-58.5" width="100.8" height="117.0" rx="10"/>
</g>

<line class="seam" x1="120.0" y1="200.0" x2="311.8" y2="391.8"/>
<line class="seam" x1="718.0" y1="200.0" x2="650.7" y2="362.5"/>
<line class="seam" x1="1030.0" y1="512.0" x2="867.5" y2="579.3"/>
<polygon class="outline" points="120.0,200.0 718.0,200.0 1030.0,512.0 1030.0,798.0 867.5,798.0 867.5,579.3 650.7,362.5 341.0,362.5 282.5,421.0 282.5,603.0 120.0,603.0"/>
<polygon class="outline" points="120.0,895.5 282.5,895.5 282.5,1129.5 120.0,1129.5"/>

<rect class="open" x="120.0" y="603.0" width="162.5" height="97.5"/>
<text class="sm" x="201.2" y="651.8" >trash</text>
<rect class="stove" x="120.0" y="700.5" width="162.5" height="195.0"/>
<circle class="burner" cx="172.0" cy="752.5" r="26.0"/><circle class="burner" cx="172.0" cy="843.5" r="20.8"/><circle class="burner" cx="230.5" cy="752.5" r="20.8"/><circle class="burner" cx="230.5" cy="843.5" r="26.0"/>
<text class="lbl" x="315.0" y="798.0" style="text-anchor:start">STOVE</text>
<text class="sm" x="315.0" y="824.0" style="text-anchor:start">(no top)</text>
<text class="sm" x="315.0" y="999.5" style="text-anchor:start">counter under pantry</text>
<text class="sm" x="315.0" y="1025.5" style="text-anchor:start">(separate top)</text>

<rect class="under" x="874.0" y="589.1" width="149.5" height="156.0"/>
<text class="lbl" x="948.8" y="657.3" style="paint-order:stroke;stroke:#f5e3da;stroke-width:8">DW</text>
<text class="sm" x="948.8" y="683.3" style="paint-order:stroke;stroke:#f5e3da;stroke-width:8">below</text>
<rect class="fridge" x="828.5" y="804.5" width="201.5" height="214.5"/>
<text class="lbl" x="929.2" y="911.8" >FRIDGE</text>

<g class="tag" transform="translate(250.0,161.0)"><rect x="-115.0" y="-19" width="230" height="38" rx="6"/><text>90° turn · 45° miter</text></g>
<g class="tag" transform="translate(692.0,161.0)"><rect x="-65.0" y="-19" width="130" height="38" rx="6"/><text>45° turn</text></g>
<g class="tag" transform="translate(1101.5,531.5)"><rect x="-65.0" y="-19" width="130" height="38" rx="6"/><text>45° turn</text></g>
<text class="lbl" x="733.1" y="503.4" style="text-anchor:end">SINK cutout (double bowl)</text>
</svg>
</body></html>
