<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #fafafa; font-family: Inter, sans-serif; color: #151515; }
  .head { width: 1250px; padding: 36px 0 0; }
  h1 { font-size: 34px; margin: 0 60px 6px; }
  p { font-size: 19px; margin: 0 60px; color: #555; }
  .draft { display: inline-block; margin: 14px 60px 0; background: #fff4d6; border: 2px solid #e0b33a; border-radius: 8px; padding: 8px 14px; font: 600 18px Inter, sans-serif; color: #6b4e00; }
  .piece { fill: #f5e3da; }
  .stripe { stroke: #d9875a; stroke-width: 4; }
  .outline { fill: none; stroke: #151515; stroke-width: 3; stroke-linejoin: round; }
  .seam { stroke: #a42f28; stroke-width: 6; stroke-linecap: round; }
  .tag rect { fill: #a42f28; }
  .tag text { fill: #fff; font: 700 20px Inter, sans-serif; text-anchor: middle; dominant-baseline: central; }
  .open { fill: #fff; stroke: #151515; stroke-width: 2.5; stroke-dasharray: 10 7; }
  .stove { fill: #fff; stroke: #151515; stroke-width: 3; }
  .burner { fill: none; stroke: #151515; stroke-width: 3; }
  .sink { fill: #fff; stroke: #151515; stroke-width: 3; }
  .under { fill: none; stroke: #555; stroke-width: 2.5; stroke-dasharray: 8 6; }
  .fridge { fill: #e4e4e4; stroke: #151515; stroke-width: 2.5; }
  .lbl { font: 700 20px Inter, sans-serif; fill: #151515; text-anchor: middle; dominant-baseline: central; }
  .sm { font: 500 17px Inter, sans-serif; fill: #555; text-anchor: middle; dominant-baseline: central; }
  .wall { fill: none; stroke: #151515; stroke-width: 10; stroke-linejoin: miter; }
</style></head>
<body>
<div class="head">
  <h1>Countertop layout: seam at every turn</h1>
  <p>Drawn from the site photos. The stripes follow each run and change direction at every seam.</p>
  <div class="draft">Not to scale. Lengths are estimates. Measure before cutting.</div>
</div>
<svg width="1250" height="1052" viewBox="0 120 1250 1052">
<defs>
  <pattern id="h" width="40" height="28" patternUnits="userSpaceOnUse"><line x1="0" y1="8" x2="40" y2="8" class="stripe"/></pattern>
  <pattern id="v" width="28" height="40" patternUnits="userSpaceOnUse"><line x1="8" y1="0" x2="8" y2="40" class="stripe"/></pattern>
  <pattern id="d" width="40" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="8" x2="40" y2="8" class="stripe"/></pattern>
</defs>
<polyline class="wall" points="124.8,1155.5 124.8,194.8 1045.2,194.8 1045.2,1058.0"/>
<text class="sm" x="585.0" y="167.5" >windows</text>
<text class="sm" x="1072.5" y="343.0" transform="rotate(90 1072.5 343.0)">window</text>
<text class="sm" x="97.5" y="525.0" transform="rotate(-90 97.5 525.0)">stove wall</text>
<text class="sm" x="1072.5" y="720.0" transform="rotate(90 1072.5 720.0)">fridge wall</text>

<polygon class="piece" points="130.0,200.0 762.8,200.0 695.5,362.5 351.0,362.5 321.8,391.8"/><polygon fill="url(#h)" points="130.0,200.0 762.8,200.0 695.5,362.5 351.0,362.5 321.8,391.8"/>
<polygon class="piece" points="762.8,200.0 1040.0,200.0 1040.0,477.2 877.5,544.5 695.5,362.5"/><polygon fill="url(#d)" points="762.8,200.0 1040.0,200.0 1040.0,477.2 877.5,544.5 695.5,362.5"/>
<polygon class="piece" points="1040.0,477.2 1040.0,824.0 877.5,824.0 877.5,544.5"/><polygon fill="url(#v)" points="1040.0,477.2 1040.0,824.0 877.5,824.0 877.5,544.5"/>
<polygon class="piece" points="130.0,200.0 321.8,391.8 292.5,421.0 292.5,700.5 130.0,700.5"/><polygon fill="url(#v)" points="130.0,200.0 321.8,391.8 292.5,421.0 292.5,700.5 130.0,700.5"/>
<polygon class="piece" points="130.0,895.5 292.5,895.5 292.5,1129.5 130.0,1129.5"/><polygon fill="url(#v)" points="130.0,895.5 292.5,895.5 292.5,1129.5 130.0,1129.5"/>

<g transform="translate(846.3,393.7) rotate(45)">
  <rect class="sink" x="-107.2" y="-71.5" width="104.0" height="143.0" rx="10"/>
  <rect class="sink" x="3.2" y="-71.5" width="104.0" height="143.0" rx="10"/>
</g>

<line class="seam" x1="130.0" y1="200.0" x2="321.8" y2="391.8"/><line class="seam" x1="695.5" y1="362.5" x2="762.8" y2="200.0"/><line class="seam" x1="877.5" y1="544.5" x2="1040.0" y2="477.2"/>
<polygon class="outline" points="130.0,200.0 1040.0,200.0 1040.0,824.0 877.5,824.0 877.5,544.5 695.5,362.5 351.0,362.5 292.5,421.0 292.5,700.5 130.0,700.5"/>
<polygon class="outline" points="130.0,895.5 292.5,895.5 292.5,1129.5 130.0,1129.5"/>

<rect class="stove" x="130.0" y="700.5" width="162.5" height="195.0"/>
<circle class="burner" cx="182.0" cy="752.5" r="26.0"/><circle class="burner" cx="182.0" cy="843.5" r="20.8"/><circle class="burner" cx="240.5" cy="752.5" r="20.8"/><circle class="burner" cx="240.5" cy="843.5" r="26.0"/>
<text class="lbl" x="325.0" y="788.2" style="text-anchor:start">STOVE</text>
<text class="sm" x="325.0" y="814.2" style="text-anchor:start">(no top)</text>
<text class="sm" x="325.0" y="999.5" style="text-anchor:start">counter under pantry</text>

<rect class="under" x="884.0" y="554.2" width="149.5" height="156.0"/>
<text class="lbl" x="958.8" y="622.5" style="paint-order:stroke;stroke:#f5e3da;stroke-width:8">DW</text>
<text class="sm" x="958.8" y="648.5" style="paint-order:stroke;stroke:#f5e3da;stroke-width:8">below</text>
<rect class="fridge" x="838.5" y="830.5" width="201.5" height="214.5"/>
<text class="lbl" x="939.2" y="937.8" >FRIDGE</text>

<text class="lbl" x="760.5" y="479.5" style="text-anchor:end">SINK in the corner,</text>
<text class="sm" x="760.5" y="505.5" style="text-anchor:end">square to the angled front</text>
<g class="tag" transform="translate(247.0,161.0)"><rect x="-115.0" y="-19" width="230" height="38" rx="6"/><text>90° turn · 45° miter</text></g>
<g class="tag" transform="translate(723.8,161.0)"><rect x="-65.0" y="-19" width="130" height="38" rx="6"/><text>45° turn</text></g>
<g class="tag" transform="translate(1111.5,496.7)"><rect x="-65.0" y="-19" width="130" height="38" rx="6"/><text>45° turn</text></g>
</svg>
</body></html>
