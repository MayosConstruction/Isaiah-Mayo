<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Bebas;src:url(BebasNeue.ttf)}@font-face{font-family:Mont;src:url(Montserrat-ExtraBold.ttf)}
*{margin:0;box-sizing:border-box}body{width:1080px;height:1350px;overflow:hidden;position:relative;background:#1e2a3a;font-family:Mont}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0) 45%,rgba(0,0,0,0) 70%,rgba(0,0,0,.55))}
.h{position:absolute;left:60px;right:60px;top:90px;text-align:center;font:400 118px/1.2 Bebas}
.h span{background:#fff;color:#111;padding:6px 26px 0;border-radius:18px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.r{color:#c4553b}
.s{position:absolute;left:70px;right:70px;bottom:110px;text-align:center;color:#fff;font:800 52px/1.25 Mont;text-shadow:0 4px 16px rgba(0,0,0,.8)}
.s b{color:#ffd23f}
.n{position:absolute;right:40px;top:40px;color:#fff;font:400 40px Bebas;opacity:.85;text-shadow:0 2px 8px #000}
.tag{position:absolute;left:50px;top:60px;background:#c4553b;color:#fff;font:400 64px/1 Bebas;padding:12px 26px 4px;border-radius:12px}
</style></head><body><img class="bg" src="close.jpg"><div class="shade"></div><div class="h" style="font-size:104px"><span>No stain. No sanding.<br><i class="r" style="font-style:normal">No splinters.</i></span></div><div class="s">Looks like wood. <b>None of the upkeep.</b></div><div class="n">4/6</div></body></html>
