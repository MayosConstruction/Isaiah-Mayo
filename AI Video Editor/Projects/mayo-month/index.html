<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Bebas"; src: url("assets/fonts/BebasNeue.ttf"); }
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/Montserrat-ExtraBold.ttf"); font-weight: 800; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .shot { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
      /* Hook + end card: Bebas Neue, black on white boxes, one word in Mayo's red. */
      .hook { position: absolute; top: 250px; left: 60px; right: 60px; text-align: center; z-index: 20; font: 400 128px/1.22 "Bebas", sans-serif; }
      .hook span.b { background: #fff; color: #111; padding: 4px 26px 0; border-radius: 16px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
      .red { color: #c4553b; }
      .small { position: absolute; top: 590px; left: 0; right: 0; text-align: center; z-index: 20; }
      .small span { background: #111; color: #fff; font: 800 44px/1.5 "Montserrat", sans-serif; padding: 6px 22px; border-radius: 12px; }
      .tag { position: absolute; top: 300px; left: 0; right: 0; text-align: center; z-index: 20; }
      .tag span { background: #fff; color: #111; font: 400 104px/1.2 "Bebas", sans-serif; padding: 6px 34px 0; border-radius: 16px; }
      .flash { position: absolute; inset: 0; background: #fff; z-index: 30; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1080" data-height="1920">
      <img id="deckb" class="clip shot" src="assets/deck-before.jpg" data-start="0" data-duration="1.5" data-track-index="0" />
      <img id="decka" class="clip shot" src="assets/deck-after.jpg" data-start="1.5" data-duration="1.7" data-track-index="0" />
      <img id="mo" class="clip shot" src="assets/meter-old.jpg" data-start="3.2" data-duration="1.0" data-track-index="0" />
      <img id="mn" class="clip shot" src="assets/meter-new.jpg" data-start="4.2" data-duration="1.2" data-track-index="0" />
      <video id="ct" class="clip shot" src="assets/counter.mp4" muted playsinline data-start="5.4" data-duration="2.6" data-media-start="0" data-playback-rate="1.5" data-track-index="0"></video>
      <video id="fl" class="clip shot" src="assets/floor.mp4" muted playsinline data-start="8.0" data-duration="1.2" data-media-start="0" data-playback-rate="0.8" data-track-index="0"></video>
      <img id="sl" class="clip shot" src="assets/slider-b.jpg" data-start="9.2" data-duration="1.0" data-track-index="0" />
      <img id="dr" class="clip shot" src="assets/door-b.jpg" data-start="10.2" data-duration="1.0" data-track-index="0" />
      <img id="fn" class="clip shot" src="assets/fan-b.jpg" data-start="11.2" data-duration="1.0" data-track-index="0" />
      <img id="end" class="clip shot" src="assets/deck-after.jpg" data-start="12.2" data-duration="1.8" data-track-index="0" />
      <div id="fx" class="clip flash" data-start="0" data-duration="14" data-track-index="2"></div>
      <div id="hook" class="clip hook" data-start="0" data-duration="3.2" data-track-index="3"><span class="b">You're welcome,<br><span class="red">Hot Springs</span></span></div>
      <div id="hs" class="clip small" data-start="0" data-duration="3.2" data-track-index="4"><span>What a father &amp; son crew fixed lately</span></div>
      <div id="t1" class="clip tag" data-start="3.2" data-duration="2.2" data-track-index="3"><span>Electrical</span></div>
      <div id="t2" class="clip tag" data-start="5.4" data-duration="2.6" data-track-index="3"><span>Countertops</span></div>
      <div id="t3" class="clip tag" data-start="8.0" data-duration="1.2" data-track-index="3"><span>Floors</span></div>
      <div id="t4" class="clip tag" data-start="9.2" data-duration="2.0" data-track-index="3"><span>Doors</span></div>
      <div id="t5" class="clip tag" data-start="11.2" data-duration="1.0" data-track-index="3"><span>Fans</span></div>
      <div id="ec" class="clip hook" data-start="12.2" data-duration="1.8" data-track-index="3"><span class="b">Father &amp; son.<br><span class="red">Hot Springs, AR</span></span></div>
      <audio id="a0" class="clip" src="assets/impact-bass-1.mp3" data-start="1.42" data-duration="0.9" data-volume="0.55" data-track-index="8"></audio>
      <audio id="a1" class="clip" src="assets/whoosh-short.mp3" data-start="3.12" data-duration="0.9" data-volume="0.4" data-track-index="9"></audio>
      <audio id="a2" class="clip" src="assets/impact-bass-1.mp3" data-start="4.12" data-duration="0.9" data-volume="0.55" data-track-index="8"></audio>
      <audio id="a3" class="clip" src="assets/whoosh-short.mp3" data-start="5.32" data-duration="0.9" data-volume="0.4" data-track-index="9"></audio>
      <audio id="a4" class="clip" src="assets/whoosh-short.mp3" data-start="7.92" data-duration="0.9" data-volume="0.4" data-track-index="8"></audio>
      <audio id="a5" class="clip" src="assets/whoosh-short.mp3" data-start="9.12" data-duration="0.9" data-volume="0.4" data-track-index="9"></audio>
      <audio id="a6" class="clip" src="assets/whoosh-short.mp3" data-start="10.12" data-duration="0.9" data-volume="0.4" data-track-index="8"></audio>
      <audio id="a7" class="clip" src="assets/whoosh-short.mp3" data-start="11.12" data-duration="0.9" data-volume="0.4" data-track-index="9"></audio>
      <audio id="a8" class="clip" src="assets/impact-bass-1.mp3" data-start="12.12" data-duration="0.9" data-volume="0.55" data-track-index="8"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Every shot punches in on its cut.
      [["#deckb",0,1.5],["#decka",1.5,1.7],["#mo",3.2,1.0],["#mn",4.2,1.2],["#ct",5.4,2.6],["#fl",8.0,1.2],["#sl",9.2,1.0],["#dr",10.2,1.0],["#fn",11.2,1.0],["#end",12.2,1.8]].forEach(([id, t, d]) => {
        tl.fromTo(id, { scale: 1.12 }, { scale: 1, duration: Math.min(d, 0.6), ease: "power3.out" }, t);
      });
      // White flash on each "after" reveal.
      [1.5, 4.2, 12.2].forEach((t) => {
        tl.fromTo("#fx", { opacity: 0.85 }, { opacity: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, t);
      });
      ["#t1","#t2","#t3","#t4","#t5"].forEach((id, i) => {
        tl.fromTo(id, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.16, ease: "back.out(2)" }, [3.2,5.4,8.0,9.2,11.2][i]);
      });
      tl.fromTo("#ec", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(2)" }, 12.25);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
