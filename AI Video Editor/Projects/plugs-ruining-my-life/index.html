<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Bebas"; src: url("assets/fonts/BebasNeue.ttf"); }
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/Montserrat-ExtraBold.ttf"); font-weight: 800; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .shot { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
      /* Hook: Bebas Neue, black on white boxes, trigger word in Mayo's red. */
      .hook { position: absolute; top: 240px; left: 50px; right: 50px; text-align: center; z-index: 20; font: 400 124px/1.22 "Bebas", sans-serif; }
      .hook span.b { background: #fff; color: #111; padding: 4px 26px 0; border-radius: 16px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
      .red { color: #c4553b; }
      /* Pain-point lines: Montserrat ExtraBold, white with black outline, key words gold. */
      .line { position: absolute; left: 70px; right: 70px; text-align: center; z-index: 18; color: #fff; font: 800 70px/1.18 "Montserrat", sans-serif; text-transform: uppercase; text-wrap: balance;
        -webkit-text-stroke: 9px #000; paint-order: stroke fill; text-shadow: 0 6px 18px rgba(0,0,0,.55); }
      .box { position: absolute; left: 50px; right: 50px; text-align: center; z-index: 18; font: 400 104px/1.22 "Bebas", sans-serif; }
      .box { color: #111; } .box::before { content: none; }
      .box { background: none; }
      .y { color: #ffd23f; }
      .box .y { color: #c4553b; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12.2" data-width="1080" data-height="1920">
      <video id="v0" class="clip shot" src="assets/shot0.mp4" muted playsinline data-start="0.00" data-duration="2.4" data-media-start="0" data-track-index="0"></video>
      <video id="v1" class="clip shot" src="assets/shot1.mp4" muted playsinline data-start="2.40" data-duration="1.3" data-media-start="0" data-track-index="0"></video>
      <video id="v2" class="clip shot" src="assets/shot2.mp4" muted playsinline data-start="3.70" data-duration="1.3" data-media-start="0" data-track-index="0"></video>
      <video id="v3" class="clip shot" src="assets/shot3.mp4" muted playsinline data-start="5.00" data-duration="1.4" data-media-start="0" data-track-index="0"></video>
      <video id="v4" class="clip shot" src="assets/shot4.mp4" muted playsinline data-start="6.40" data-duration="1.6" data-media-start="0" data-track-index="0"></video>
      <video id="v5" class="clip shot" src="assets/shot5.mp4" muted playsinline data-start="8.00" data-duration="1.6" data-media-start="0" data-track-index="0"></video>
      <img id="v6" class="clip shot" src="assets/shot6.jpg" data-start="9.60" data-duration="2.6" data-track-index="0" />
      <div id="hook" class="clip hook" data-start="0" data-duration="2.4" data-track-index="3"><span class="b">Screw plugs are<br><span class="red">ruining</span> my life</span></div>
      <div id="l0" class="clip line" style="top:640px" data-start="2.4" data-duration="1.3" data-track-index="4">Every. Single. <span class="y">Screw.</span></div>
      <div id="l1" class="clip line" style="top:640px" data-start="3.7" data-duration="1.3" data-track-index="5">Gets a <span class="y">plug.</span></div>
      <div id="l2" class="clip line" style="top:640px" data-start="5.0" data-duration="3.0" data-track-index="4">Glue. Plug. Tap. <span class="y">Trim.</span></div>
      <div id="l3" class="clip line" style="top:640px" data-start="8.0" data-duration="1.6" data-track-index="5">By hand.<br>On <span class="y">every board.</span></div>
      <div id="l4" class="clip box" style="top:640px" data-start="9.6" data-duration="2.6" data-track-index="4"><span class="b" style="background:#fff;padding:4px 26px 0;border-radius:16px;-webkit-box-decoration-break:clone;box-decoration-break:clone">...okay fine.<br>It&#x27;s <span class="y">worth it</span> 😮‍💨</span></div>
      <audio id="p0" class="clip" src="assets/pop.mp3" data-start="2.4" data-duration="0.5" data-volume="0.45" data-track-index="8"></audio>
      <audio id="p1" class="clip" src="assets/pop.mp3" data-start="3.7" data-duration="0.5" data-volume="0.45" data-track-index="9"></audio>
      <audio id="p2" class="clip" src="assets/pop.mp3" data-start="5.0" data-duration="0.5" data-volume="0.45" data-track-index="8"></audio>
      <audio id="p3" class="clip" src="assets/pop.mp3" data-start="8.0" data-duration="0.5" data-volume="0.45" data-track-index="9"></audio>
      <audio id="p4" class="clip" src="assets/pop.mp3" data-start="9.6" data-duration="0.5" data-volume="0.45" data-track-index="8"></audio>
      <audio id="w0" class="clip" src="assets/whoosh-short.mp3" data-start="2.32" data-duration="0.8" data-volume="0.3" data-track-index="10"></audio>
      <audio id="w1" class="clip" src="assets/whoosh-short.mp3" data-start="3.62" data-duration="0.8" data-volume="0.3" data-track-index="11"></audio>
      <audio id="w2" class="clip" src="assets/whoosh-short.mp3" data-start="4.92" data-duration="0.8" data-volume="0.3" data-track-index="10"></audio>
      <audio id="w3" class="clip" src="assets/whoosh-short.mp3" data-start="6.32" data-duration="0.8" data-volume="0.3" data-track-index="11"></audio>
      <audio id="w4" class="clip" src="assets/whoosh-short.mp3" data-start="7.92" data-duration="0.8" data-volume="0.3" data-track-index="10"></audio>
      <audio id="w5" class="clip" src="assets/whoosh-short.mp3" data-start="9.52" data-duration="0.8" data-volume="0.3" data-track-index="11"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      [["#v0",0.00,2.4],["#v1",2.40,1.3],["#v2",3.70,1.3],["#v3",5.00,1.4],["#v4",6.40,1.6],["#v5",8.00,1.6],["#v6",9.60,2.6]].forEach(([id, t, d]) => {
        tl.fromTo(id, { scale: 1.1 }, { scale: 1, duration: Math.min(d, 0.6), ease: "power3.out" }, t);
      });
      [["#l0",2.4],["#l1",3.7],["#l2",5.0],["#l3",8.0],["#l4",9.6]].forEach(([id, t]) => {
        tl.fromTo(id, { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.18, ease: "back.out(2)", immediateRender: false }, t);
      });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
