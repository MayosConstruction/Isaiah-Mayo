<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Bricolage"; src: url("assets/fonts/BricolageGrotesque-ExtraBold.ttf"); font-weight: 800; }
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/Montserrat-Bold.ttf"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .shot { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
      /* Hooks: Bricolage Grotesque ExtraBold, sentence case, tight, soft shadow; one word in yellow. */
      .hook {
        position: absolute; top: 300px; left: 80px; right: 80px; text-align: center; z-index: 10; color: #fff;
        font: 800 112px/1.0 "Bricolage", sans-serif; letter-spacing: -0.035em; text-wrap: balance;
        text-shadow: 0 4px 24px rgba(0, 0, 0, 0.55), 0 1px 4px rgba(0, 0, 0, 0.5);
      }
      .hook .red { color: #ffd23f; }
      .sub {
        position: absolute; top: 560px; left: 90px; right: 90px; text-align: center; z-index: 11; color: #fff;
        font: 700 50px/1.25 "Montserrat", sans-serif; text-wrap: balance;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 12px rgba(0, 0, 0, 0.6), 0 0 26px rgba(0, 0, 0, 0.4);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <!-- Fast cuts through real job footage, about a second each, ending on the slow-mo tool toss. -->
      <video id="v1" class="clip shot" src="assets/bats.mp4" muted playsinline data-start="0" data-duration="1.3" data-media-start="27.25" data-track-index="0"></video>
      <video id="v2" class="clip shot" src="assets/deck.mp4" muted playsinline data-start="1.3" data-duration="1.1" data-media-start="0.6" data-track-index="0"></video>
      <video id="v3" class="clip shot" src="assets/breaker.mp4" muted playsinline data-start="2.4" data-duration="1.1" data-media-start="0.8" data-track-index="0"></video>
      <video id="v4" class="clip shot" src="assets/ladder.mp4" muted playsinline data-start="3.5" data-duration="1.1" data-media-start="1.2" data-track-index="0"></video>
      <video id="v5" class="clip shot" src="assets/plugs.mp4" muted playsinline data-start="4.6" data-duration="1.2" data-media-start="4.2" data-track-index="0"></video>
      <video id="v6" class="clip shot" src="assets/drive.mp4" muted playsinline data-start="5.8" data-duration="1.2" data-media-start="2" data-track-index="0"></video>
      <video id="v7" class="clip shot" src="assets/toss.mp4" muted playsinline data-start="7" data-duration="3" data-media-start="0" data-playback-rate="0.5" data-track-index="0"></video>

      <div id="h1" class="clip hook" data-start="0" data-duration="2.4" data-track-index="1">Small business <span class="red">owners</span></div>
      <div id="h2" class="clip hook" data-start="2.4" data-duration="2.4" data-track-index="1">Drop your business name <span class="red">below</span></div>
      <div id="h3" class="clip hook" data-start="4.8" data-duration="2.6" data-track-index="1">Follow 3 people in the <span class="red">comments</span></div>
      <div id="h4" class="clip hook" data-start="7.4" data-duration="2.6" data-track-index="1">We grow <span class="red">together</span></div>
      <div id="s1" class="clip sub" data-start="7.9" data-duration="2.1" data-track-index="2">I’ll go first: Mayo’s Construction, Hot Springs, AR</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Each line slams in, the footage punches in on every cut.
      [["#h1", 0], ["#h2", 2.4], ["#h3", 4.8], ["#h4", 7.4]].forEach(([id, t]) => {
        tl.fromTo(id, { scale: 1.35, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.16, ease: "power4.out" }, t);
      });
      [["#v1", 0, 1.3], ["#v2", 1.3, 1.1], ["#v3", 2.4, 1.1], ["#v4", 3.5, 1.1], ["#v5", 4.6, 1.2], ["#v6", 5.8, 1.2], ["#v7", 7, 3]].forEach(([id, t, d]) => {
        tl.fromTo(id, { scale: 1.12 }, { scale: 1, duration: Math.min(d, 0.5), ease: "power3.out" }, t);
      });
      tl.fromTo("#s1", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 7.95);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
