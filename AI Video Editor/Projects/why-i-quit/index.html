<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Bold.ttf"); font-weight: 700; }
      @font-face { font-family: "Playfair Display"; src: url("assets/fonts/PlayfairDisplay-Bold.ttf"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .shot { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
      /* Storytelling: Inter for the story, Playfair Display for the last line. */
      .line {
        position: absolute; top: 430px; left: 110px; right: 110px; text-align: center; z-index: 10; color: #fff;
        font: 700 56px/1.25 "Inter", sans-serif; letter-spacing: -0.02em; text-wrap: balance;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85), 0 0 12px rgba(0, 0, 0, 0.55), 0 0 26px rgba(0, 0, 0, 0.35);
      }
      #l6 { font: 700 78px/1.15 "Playfair Display", serif; letter-spacing: 0; top: 400px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16.9" data-width="1080" data-height="1920">
      <!-- Footage only (silent). Soft music goes on in the app. -->
      <video id="v1" class="clip shot" src="assets/drive.mp4" muted playsinline data-start="0" data-duration="3" data-media-start="1" data-track-index="0"></video>
      <video id="v2" class="clip shot" src="assets/drive.mp4" muted playsinline data-start="3" data-duration="3" data-media-start="4.4" data-track-index="0"></video>
      <video id="v3" class="clip shot" src="assets/deck.mp4" muted playsinline data-start="6" data-duration="2.6" data-media-start="0.5" data-track-index="0"></video>
      <video id="v4" class="clip shot" src="assets/counter.mp4" muted playsinline data-start="8.6" data-duration="2.6" data-media-start="0" data-playback-rate="0.9" data-track-index="0"></video>
      <video id="v5" class="clip shot" src="assets/ladder.mp4" muted playsinline data-start="11.2" data-duration="2.6" data-media-start="1" data-track-index="0"></video>
      <video id="v6" class="clip shot" src="assets/plugs.mp4" muted playsinline data-start="13.8" data-duration="3.1" data-media-start="3.8" data-playback-rate="0.8" data-track-index="0"></video>

      <div id="l1" class="clip line" data-start="0.2" data-duration="2.8" data-track-index="1">I was a law enforcement officer.</div>
      <div id="l2" class="clip line" data-start="3" data-duration="3" data-track-index="1">That job is difficult. More than most people will ever know.</div>
      <div id="l3" class="clip line" data-start="6" data-duration="2.6" data-track-index="1">So I made the hardest call I’ve made.</div>
      <div id="l4" class="clip line" data-start="8.6" data-duration="2.6" data-track-index="1">I hung it up and started construction full-time.</div>
      <div id="l5" class="clip line" data-start="11.2" data-duration="2.6" data-track-index="1">Building something with my dad.</div>
      <div id="l6" class="clip line" data-start="13.8" data-duration="3.1" data-track-index="1">Still hard work. Just a hard I chose.</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Slow push-in on every shot; each line fades up gently.
      [["#v1", 0, 3], ["#v2", 3, 3], ["#v3", 6, 2.6], ["#v4", 8.6, 2.6], ["#v5", 11.2, 2.6], ["#v6", 13.8, 3.1]].forEach(([id, t, d]) => {
        tl.fromTo(id, { scale: 1 }, { scale: 1.06, duration: d, ease: "none" }, t);
      });
      [["#l1", 0.2], ["#l2", 3], ["#l3", 6], ["#l4", 8.6], ["#l5", 11.2], ["#l6", 13.8]].forEach(([id, t]) => {
        tl.fromTo(id, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t + 0.05);
      });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
