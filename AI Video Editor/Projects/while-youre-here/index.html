<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Bebas"; src: url("assets/fonts/BebasNeue.ttf"); }
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/Montserrat-ExtraBold.ttf"); font-weight: 800; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #cam { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
      /* Hook: Bebas Neue, black on white boxes, trigger word in Mayo's red. */
      .hook { position: absolute; top: 240px; left: 50px; right: 50px; text-align: center; z-index: 20; font: 400 116px/1.22 "Bebas", sans-serif; }
      .hook span.b, .box span.b { background: #fff; color: #111; padding: 4px 26px 0; border-radius: 16px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
      .red { color: #c4553b; }
      /* Lines: Montserrat ExtraBold, white with black outline, key words gold. */
      .line { position: absolute; left: 60px; right: 60px; text-align: center; z-index: 18; color: #fff; font: 800 76px/1.16 "Montserrat", sans-serif; text-transform: uppercase; text-wrap: balance;
        -webkit-text-stroke: 10px #000; paint-order: stroke fill; text-shadow: 0 6px 18px rgba(0,0,0,.55); }
      .box { position: absolute; left: 50px; right: 50px; text-align: center; z-index: 18; font: 400 116px/1.22 "Bebas", sans-serif; }
      .y { color: #ffd23f; }
      .box .y { color: #c4553b; }
      .wipe { position: absolute; top: 0; bottom: 0; left: 0; width: 10px; margin-left: -5px; background: #fff; z-index: 12; box-shadow: 0 0 24px rgba(0,0,0,.5); }
      .ba { position: absolute; top: 1250px; z-index: 16; font: 400 72px/1 "Bebas", sans-serif; color: #fff; background: rgba(0,0,0,.6); padding: 12px 26px 6px; border-radius: 12px; }
      .flash { position: absolute; inset: 0; background: #fff; z-index: 30; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12.2" data-width="1080" data-height="1920">
      <div id="cam">
      <video id="v0" class="clip shot" src="assets/shot0.mp4" muted playsinline data-start="0.00" data-duration="2.2" data-media-start="0" data-track-index="0"></video>
      <video id="v1" class="clip shot" src="assets/shot1.mp4" muted playsinline data-start="2.20" data-duration="1.5" data-media-start="0" data-track-index="0"></video>
      <video id="v2" class="clip shot" src="assets/shot2.mp4" muted playsinline data-start="3.70" data-duration="1.5" data-media-start="0" data-track-index="0"></video>
      <video id="v3" class="clip shot" src="assets/shot3.mp4" muted playsinline data-start="5.20" data-duration="1.5" data-media-start="0" data-track-index="0"></video>
      <video id="v4" class="clip shot" src="assets/shot4.mp4" muted playsinline data-start="6.70" data-duration="1.5" data-media-start="0" data-track-index="0"></video>
      <video id="v5" class="clip shot" src="assets/shot5.mp4" muted playsinline data-start="8.20" data-duration="1.4" data-media-start="0" data-track-index="0"></video>
      <video id="v6" class="clip shot" src="assets/shot6.mp4" muted playsinline data-start="9.60" data-duration="2.6" data-media-start="0" data-track-index="0"></video>
      </div>
      <div id="fx" class="clip flash" data-start="0" data-duration="12.2" data-track-index="3"></div>
      <div id="hook" class="clip hook" data-start="0" data-duration="2.2" data-track-index="3"><span class="b">&quot;While you&#x27;re here&quot;<br>is <span class="red">ruining</span> my life</span></div>
      <div id="l0" class="clip line" style="top:1180px" data-start="0.0" data-duration="2.2" data-track-index="4">Came to fix <span class="y">ONE</span> vent cover</div>
      <div id="l1" class="clip line" style="top:640px" data-start="2.2" data-duration="1.5" data-track-index="5">&quot;While you&#x27;re here...<br><span class="y">the light?&quot;</span></div>
      <div id="l2" class="clip line" style="top:640px" data-start="3.7" data-duration="1.5" data-track-index="4">&quot;...and the <span class="y">breaker</span><br>keeps tripping&quot;</div>
      <div id="l3" class="clip line" style="top:640px" data-start="5.2" data-duration="1.5" data-track-index="5">&quot;...the <span class="y">ceiling?&quot;</span></div>
      <div id="l4" class="clip line" style="top:640px" data-start="6.7" data-duration="1.5" data-track-index="4">&quot;...the kitchen<br><span class="y">counters?&quot;</span></div>
      <div id="l5" class="clip line" style="top:640px" data-start="8.2" data-duration="1.4" data-track-index="5">&quot;...oh, and<br>the <span class="y">floors&quot;</span> 💀</div>
      <div id="l6" class="clip box" style="top:640px" data-start="9.6" data-duration="2.6" data-track-index="4"><span class="b"><span class="y">Day 3</span> of fixing<br>one vent cover</span></div>
      <audio id="a0" class="clip" src="assets/nat0.m4a" data-start="0.00" data-duration="2.20" data-volume="0.4" data-track-index="8"></audio>
      <audio id="a1" class="clip" src="assets/nat1.m4a" data-start="2.20" data-duration="1.50" data-volume="0.4" data-track-index="9"></audio>
      <audio id="a2" class="clip" src="assets/whoosh-short.mp3" data-start="2.10" data-duration="1.60" data-volume="0.35" data-track-index="10"></audio>
      <audio id="a3" class="clip" src="assets/nat2.m4a" data-start="3.70" data-duration="1.50" data-volume="0.6" data-track-index="11"></audio>
      <audio id="a4" class="clip" src="assets/whoosh-short.mp3" data-start="3.60" data-duration="1.60" data-volume="0.35" data-track-index="12"></audio>
      <audio id="a5" class="clip" src="assets/nat3.m4a" data-start="5.20" data-duration="1.50" data-volume="0.3" data-track-index="13"></audio>
      <audio id="a6" class="clip" src="assets/whoosh-short.mp3" data-start="5.10" data-duration="1.60" data-volume="0.35" data-track-index="8"></audio>
      <audio id="a7" class="clip" src="assets/nat4.m4a" data-start="6.70" data-duration="1.50" data-volume="0.2" data-track-index="9"></audio>
      <audio id="a8" class="clip" src="assets/whoosh-short.mp3" data-start="6.60" data-duration="1.60" data-volume="0.35" data-track-index="10"></audio>
      <audio id="a9" class="clip" src="assets/nat5.m4a" data-start="8.20" data-duration="1.40" data-volume="0.3" data-track-index="11"></audio>
      <audio id="a10" class="clip" src="assets/whoosh-short.mp3" data-start="8.10" data-duration="1.60" data-volume="0.35" data-track-index="12"></audio>
      <audio id="a11" class="clip" src="assets/nat6.m4a" data-start="9.60" data-duration="2.60" data-volume="0.8" data-track-index="13"></audio>
      <audio id="a12" class="clip" src="assets/whoosh-short.mp3" data-start="9.50" data-duration="1.60" data-volume="0.35" data-track-index="8"></audio>
      <audio id="a13" class="clip" src="assets/boom.mp3" data-start="0.00" data-duration="1.60" data-volume="0.8" data-track-index="9"></audio>
      <audio id="a14" class="clip" src="assets/notification.mp3" data-start="2.20" data-duration="1.60" data-volume="0.55" data-track-index="10"></audio>
      <audio id="a15" class="clip" src="assets/notification.mp3" data-start="3.70" data-duration="1.60" data-volume="0.55" data-track-index="11"></audio>
      <audio id="a16" class="clip" src="assets/notification.mp3" data-start="5.20" data-duration="1.60" data-volume="0.55" data-track-index="12"></audio>
      <audio id="a17" class="clip" src="assets/notification.mp3" data-start="6.70" data-duration="1.60" data-volume="0.55" data-track-index="13"></audio>
      <audio id="a18" class="clip" src="assets/error.mp3" data-start="8.20" data-duration="1.60" data-volume="0.55" data-track-index="8"></audio>
      <audio id="a19" class="clip" src="assets/boom.mp3" data-start="9.60" data-duration="1.60" data-volume="0.55" data-track-index="9"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      [["#v0",0.00,2.2],["#v1",2.20,1.5],["#v2",3.70,1.5],["#v3",5.20,1.5],["#v4",6.70,1.5],["#v5",8.20,1.4],["#v6",9.60,2.6]].forEach(([id, t, d]) => {
        tl.fromTo(id, { scale: 1.14 }, { scale: 1, duration: Math.min(d, 0.5), ease: "power3.out", immediateRender: false }, t);
      });
      // Hook is readable on frame 0, then punches with the boom.
      tl.fromTo("#hook", { scale: 1 }, { keyframes: [{ scale: 1.12, duration: 0.06 }, { scale: 1, duration: 0.22, ease: "back.out(3)" }], immediateRender: false }, 0.02);
      [["#l1",2.2],["#l2",3.7],["#l3",5.2],["#l4",6.7],["#l5",8.2],["#l6",9.6]].forEach(([id, t]) => {
        tl.fromTo(id, { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.16, ease: "power4.out", immediateRender: false }, t);
      });
      // Camera shake on punches.
      [0.00,5.20,6.70,8.20,9.60].forEach((t) => {
        tl.fromTo("#cam", { x: 0, y: 0 }, { keyframes: [{ x: -18, y: 10, duration: 0.04 }, { x: 16, y: -12, duration: 0.04 }, { x: -10, y: 6, duration: 0.04 }, { x: 6, y: -4, duration: 0.04 }, { x: 0, y: 0, duration: 0.05 }], immediateRender: false }, t + 0.02);
      });
      [9.60].forEach((t) => {
        tl.fromTo("#fx", { opacity: 0.8 }, { opacity: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, t);
      });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
