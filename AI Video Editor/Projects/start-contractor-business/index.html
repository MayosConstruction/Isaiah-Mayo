<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Bebas"; src: url("assets/fonts/BebasNeue.ttf"); }
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/Montserrat-ExtraBold.ttf"); font-weight: 800; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .shot { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
      /* Hook: Bebas Neue, black on white boxes, trigger word in Mayo's red. */
      .hook { position: absolute; top: 240px; left: 50px; right: 50px; text-align: center; z-index: 20; font: 400 104px/1.22 "Bebas", sans-serif; }
      .hook span.b { background: #fff; color: #111; padding: 4px 26px 0; border-radius: 16px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
      .red { color: #c4553b; }
      /* Pain-point lines: Montserrat ExtraBold, white with black outline, key words gold. */
      .line { position: absolute; left: 70px; right: 70px; text-align: center; z-index: 18; color: #fff; font: 800 70px/1.18 "Montserrat", sans-serif; text-transform: uppercase; text-wrap: balance;
        -webkit-text-stroke: 9px #000; paint-order: stroke fill; text-shadow: 0 6px 18px rgba(0,0,0,.55); }
      .box { position: absolute; left: 50px; right: 50px; text-align: center; z-index: 18; font: 400 104px/1.22 "Bebas", sans-serif; }
      .box { color: #111; } .box::before { content: none; }
      .box { background: none; }
      .y { color: #ffd23f; }
      .box .y { color: #c4553b; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="17.0" data-width="1080" data-height="1920">
      <video id="v0" class="clip shot" src="assets/shot0.mp4" muted playsinline data-start="0.00" data-duration="2.6" data-media-start="0" data-track-index="0"></video>
      <video id="v1" class="clip shot" src="assets/shot1.mp4" muted playsinline data-start="2.60" data-duration="2.0" data-media-start="0" data-track-index="0"></video>
      <video id="v2" class="clip shot" src="assets/shot2.mp4" muted playsinline data-start="4.60" data-duration="2.0" data-media-start="0" data-track-index="0"></video>
      <video id="v3" class="clip shot" src="assets/shot3.mp4" muted playsinline data-start="6.60" data-duration="2.0" data-media-start="0" data-track-index="0"></video>
      <video id="v4" class="clip shot" src="assets/shot4.mp4" muted playsinline data-start="8.60" data-duration="2.0" data-media-start="0" data-track-index="0"></video>
      <video id="v5" class="clip shot" src="assets/shot5.mp4" muted playsinline data-start="10.60" data-duration="2.0" data-media-start="0" data-track-index="0"></video>
      <img id="v6" class="clip shot" src="assets/shot6.jpg" data-start="12.60" data-duration="2.2" data-track-index="0" />
      <video id="v7" class="clip shot" src="assets/shot7.mp4" muted playsinline data-start="14.80" data-duration="2.2" data-media-start="0" data-track-index="0"></video>
      <div id="hook" class="clip hook" data-start="0" data-duration="2.6" data-track-index="3"><span class="b">How I&#x27;d start a contractor<br>business with <span class="red">no experience</span></span></div>
      <div id="l0" class="clip line" style="top:640px" data-start="2.6" data-duration="2.0" data-track-index="4">1. File an <span class="y">LLC</span></div>
      <div id="l1" class="clip line" style="top:640px" data-start="4.6" data-duration="2.0" data-track-index="5">2. Get your<br>contractor <span class="y">license</span></div>
      <div id="l2" class="clip line" style="top:640px" data-start="6.6" data-duration="2.0" data-track-index="4">3. Get <span class="y">insured</span></div>
      <div id="l3" class="clip line" style="top:640px" data-start="8.6" data-duration="2.0" data-track-index="5">4. Find <span class="y">subs</span> you trust</div>
      <div id="l4" class="clip line" style="top:640px" data-start="10.6" data-duration="2.0" data-track-index="4">5. <span class="y">Knock doors.</span><br>Seriously.</div>
      <div id="l5" class="clip line" style="top:640px" data-start="12.6" data-duration="2.2" data-track-index="5">6. Post <span class="y">every</span><br>single job</div>
      <div id="l6" class="clip box" style="top:640px" data-start="14.8" data-duration="2.2" data-track-index="4"><span class="b" style="background:#fff;padding:4px 26px 0;border-radius:16px;-webkit-box-decoration-break:clone;box-decoration-break:clone">No experience.<br><span class="y">Just start.</span></span></div>
      <audio id="p0" class="clip" src="assets/pop.mp3" data-start="2.6" data-duration="0.5" data-volume="0.45" data-track-index="8"></audio>
      <audio id="p1" class="clip" src="assets/pop.mp3" data-start="4.6" data-duration="0.5" data-volume="0.45" data-track-index="9"></audio>
      <audio id="p2" class="clip" src="assets/pop.mp3" data-start="6.6" data-duration="0.5" data-volume="0.45" data-track-index="8"></audio>
      <audio id="p3" class="clip" src="assets/pop.mp3" data-start="8.6" data-duration="0.5" data-volume="0.45" data-track-index="9"></audio>
      <audio id="p4" class="clip" src="assets/pop.mp3" data-start="10.6" data-duration="0.5" data-volume="0.45" data-track-index="8"></audio>
      <audio id="p5" class="clip" src="assets/pop.mp3" data-start="12.6" data-duration="0.5" data-volume="0.45" data-track-index="9"></audio>
      <audio id="p6" class="clip" src="assets/pop.mp3" data-start="14.8" data-duration="0.5" data-volume="0.45" data-track-index="8"></audio>
      <audio id="w0" class="clip" src="assets/whoosh-short.mp3" data-start="2.52" data-duration="0.8" data-volume="0.3" data-track-index="10"></audio>
      <audio id="w1" class="clip" src="assets/whoosh-short.mp3" data-start="4.52" data-duration="0.8" data-volume="0.3" data-track-index="11"></audio>
      <audio id="w2" class="clip" src="assets/whoosh-short.mp3" data-start="6.52" data-duration="0.8" data-volume="0.3" data-track-index="10"></audio>
      <audio id="w3" class="clip" src="assets/whoosh-short.mp3" data-start="8.52" data-duration="0.8" data-volume="0.3" data-track-index="11"></audio>

      <audio id="w5" class="clip" src="assets/whoosh-short.mp3" data-start="12.52" data-duration="0.8" data-volume="0.3" data-track-index="11"></audio>
      <audio id="w6" class="clip" src="assets/whoosh-short.mp3" data-start="14.72" data-duration="0.8" data-volume="0.3" data-track-index="10"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      [["#v0",0.00,2.6],["#v1",2.60,2.0],["#v2",4.60,2.0],["#v3",6.60,2.0],["#v4",8.60,2.0],["#v5",10.60,2.0],["#v6",12.60,2.2],["#v7",14.80,2.2]].forEach(([id, t, d]) => {
        tl.fromTo(id, { scale: 1.1 }, { scale: 1, duration: Math.min(d, 0.6), ease: "power3.out" }, t);
      });
      [["#l0",2.6],["#l1",4.6],["#l2",6.6],["#l3",8.6],["#l4",10.6],["#l5",12.6],["#l6",14.8]].forEach(([id, t]) => {
        tl.fromTo(id, { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.18, ease: "back.out(2)", immediateRender: false }, t);
      });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
